spring:
  datasource:
    url: jdbc:h2:mem:expensetracker-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs512-algorithm-usage-in-tests!!
    access-expiration-minutes: 15
    refresh-expiration-days: 7
  cors:
    allowed-origins: http://localhost:5173
  mail:
    enabled: false
  security:
    cookie-secure: false
  auth:
    rate-limit-per-minute: 10000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.expensetracker: WARN
    org.hibernate.SQL: WARN
